name: Repoint Rabbit social assets once
on:
  push:
    paths:
      - '.github/workflows/repoint-rabbit-social-assets-once.yml'
permissions:
  contents: write
jobs:
  repoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild clean share routes from entries
        run: |
          python3 - <<'PY'
          import json, html, pathlib
          data=json.load(open('rabbit-hole/entries.json'))
          entries=data['entries']
          missing=[]
          for a in entries:
              n=a['number']; slug=a['id']
              asset=pathlib.Path(f'rabbit-hole/assets/{n}-{slug}.png')
              if not asset.exists(): missing.append(str(asset))
          if missing:
              raise SystemExit('Missing canonical Rabbit assets:\n'+'\n'.join(missing))
          for a in entries:
              n=a['number']; slug=a['id']; title=a['title']; desc=a.get('subtitle') or a.get('description') or ''
              canonical=f'https://zerotrace.fyi/rabbit-hole/{slug}/'
              image=f'https://zerotrace.fyi/rabbit-hole/assets/{n}-{slug}.png?v=20260917d'
              q=lambda s: html.escape(str(s), quote=True)
              out=f'''<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>{q(title)} | ZeroTrace</title>\n<meta name="description" content="{q(desc)}">\n<link rel="canonical" href="{q(canonical)}">\n<meta property="og:type" content="article">\n<meta property="og:site_name" content="ZeroTrace">\n<meta property="og:title" content="{q(title)}">\n<meta property="og:description" content="{q(desc)}">\n<meta property="og:url" content="{q(canonical)}">\n<meta property="og:image" content="{q(image)}">\n<meta property="og:image:secure_url" content="{q(image)}">\n<meta property="og:image:type" content="image/png">\n<meta property="og:image:width" content="1536">\n<meta property="og:image:height" content="864">\n<meta property="og:image:alt" content="{q(n+' // '+title)}">\n<meta name="twitter:card" content="summary_large_image">\n<meta name="twitter:title" content="{q(title)}">\n<meta name="twitter:description" content="{q(desc)}">\n<meta name="twitter:image" content="{q(image)}">\n<meta name="twitter:image:alt" content="{q(n+' // '+title)}">\n<style>html,body{{margin:0;background:#05070A;color:#eef4f0;font-family:monospace}}main{{min-height:100vh;display:grid;place-items:center;padding:24px}}a{{color:#F4B728}}</style>\n<script>(function(){{var target="../?article={q(slug)}";if(location.search!=="?no-redirect=1")location.replace(target);}})();</script>\n</head><body><main><p>Opening <a href="../?article={q(slug)}">{q(title)}</a>…</p></main></body></html>\n'''
              p=pathlib.Path('rabbit-hole')/slug/'index.html'
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(out)
          PY
      - name: Verify no clean route points at root rabbit aliases
        run: |
          if grep -R 'zerotrace.fyi/assets/rabbit-' rabbit-hole/*/index.html; then
            echo 'Old root rabbit asset reference remains.' >&2
            exit 1
          fi
          test "$(find rabbit-hole -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 21
      - name: Commit route metadata only
        run: |
          git config user.name 'ZeroTrace Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add rabbit-hole/*/index.html
          git commit -m 'Point Rabbit Hole share cards to canonical Rabbit assets' || true
          git push
