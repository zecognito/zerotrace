name: Rebuild 021 social card once
on:
  push:
    paths:
      - '.github/workflows/rebuild-021-social-card-once.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebuild 021 as standard truecolor PNG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          f='rabbit-hole/assets/021-did-the-nsa-build-bitcoin.png'
          convert "$f" -resize '1200x675!' -alpha off -colorspace sRGB -strip -define png:color-type=2 -define png:compression-level=9 PNG24:/tmp/021.png
          mv /tmp/021.png "$f"
          identify -verbose "$f" | grep -E 'Geometry|Colorspace|Type|Filesize' || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('rabbit-hole/did-the-nsa-build-bitcoin/index.html')
          s=p.read_text()
          s=s.replace('?v=20260917e','?v=20260917f')
          s=s.replace('content="1536"','content="1200"')
          s=s.replace('content="864"','content="675"')
          p.write_text(s)
          PY
          rm -f .github/workflows/rebuild-021-social-card-once.yml
          git config user.name 'ZeroTrace Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$f" rabbit-hole/did-the-nsa-build-bitcoin/index.html .github/workflows/rebuild-021-social-card-once.yml
          git commit -m 'Rebuild 021 social card for crawler compatibility'
          git push origin HEAD:main
