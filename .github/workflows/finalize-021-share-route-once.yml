name: Finalize permanent 021 share route once
on:
  push:
    paths:
      - '.github/workflows/finalize-021-share-route-once.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make fresh 021 route permanent
        run: |
          set -euo pipefail
          mkdir -p rabbit-hole/did-nsa-build-bitcoin
          cat > rabbit-hole/did-nsa-build-bitcoin/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>DID THE NSA BUILD BITCOIN? | ZeroTrace</title>
          <meta name="description" content="THE CONNECTIONS NOBODY WANTS TO TALK ABOUT.">
          <link rel="canonical" href="https://zerotrace.fyi/rabbit-hole/did-nsa-build-bitcoin/">
          <meta property="og:type" content="article">
          <meta property="og:site_name" content="ZeroTrace">
          <meta property="og:title" content="DID THE NSA BUILD BITCOIN?">
          <meta property="og:description" content="THE CONNECTIONS NOBODY WANTS TO TALK ABOUT.">
          <meta property="og:url" content="https://zerotrace.fyi/rabbit-hole/did-nsa-build-bitcoin/">
          <meta property="og:image" content="https://zerotrace.fyi/rabbit-hole/assets/021-did-the-nsa-build-bitcoin-social.png">
