name: Fix Rabbit Hole clean routes
on:
  push:
    paths:
      - '.github/workflows/fix-rabbit-clean-routes.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Rabbit Hole links
        shell: python
        run: |
          from pathlib import Path
          p = Path('rabbit-hole/index.html')
          s = p.read_text()
          old = "const articleHref=id==='bitcoin-vs-zcash'?'bitcoin-vs-zcash/':`?article=${encodeURIComponent(id)}`;"
          new = "const articleHref=`${encodeURIComponent(id)}/`;"
          if s.count(old) != 2:
              raise SystemExit(f'Expected 2 matches, found {s.count(old)}')
          p.write_text(s.replace(old, new))
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rabbit-hole/index.html
          git commit -m "Use clean routes for all Rabbit Hole articles"
          git push
