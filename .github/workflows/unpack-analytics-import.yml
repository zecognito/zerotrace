name: Unpack Analytics Import

on:
  push:
    branches: [analytics-import]
    paths:
      - 'analytics-baseline.tar.xz'
      - '.github/workflows/unpack-analytics-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analytics-import
      - name: Unpack approved Analytics baseline
        run: |
          set -euo pipefail
          test -f analytics-baseline.tar.xz
          tar -xJf analytics-baseline.tar.xz
          rm analytics-baseline.tar.xz
          rm -f analytics/.gitkeep
      - name: Commit imported Analytics tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analytics .github/workflows/unpack-analytics-import.yml
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'Import approved ZeroTrace Analytics baseline'
          git push origin HEAD:analytics-import
