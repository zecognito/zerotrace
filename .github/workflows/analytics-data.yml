name: ZeroTrace Analytics Data
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: zerotrace-analytics-data
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update analytics JSON
        env:
          ZCASH_RPC_URL: ${{ secrets.ZCASH_RPC_URL }}
          ZCASH_RPC_USER: ${{ secrets.ZCASH_RPC_USER }}
          ZCASH_RPC_PASSWORD: ${{ secrets.ZCASH_RPC_PASSWORD }}
        run: python scripts/update_analytics.py
      - name: Commit changed data
        run: |
          git config user.name "zerotrace-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add analytics/data/latest.json
          git diff --cached --quiet || git commit -m "data: refresh analytics"
          git push
