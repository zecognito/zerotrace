name: Optimize broken Rabbit social cards once
on:
  push:
    paths: ['.github/workflows/optimize-rabbit-social-cards-once.yml']
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq pngquant imagemagick
          files=(rabbit-hole/assets/002-privacy-was-always-part-of-the-conversation.png rabbit-hole/assets/005-the-crowd-is-part-of-the-privacy.png rabbit-hole/assets/006-from-coinbase-to-darkness.png rabbit-hole/assets/009-privacy-has-an-exit-problem.png rabbit-hole/assets/010-cash-was-private-by-default.png rabbit-hole/assets/020-the-address-is-not-the-identity.png rabbit-hole/assets/021-did-the-nsa-build-bitcoin.png)
          for f in "${files[@]}"; do convert "$f" -gravity center -crop 1536x864+0+0 +repage -strip PNG24:/tmp/card.png; pngquant --force --strip --quality=70-90 --speed 1 --output "$f" -- /tmp/card.png; done
          rm -f .github/workflows/optimize-rabbit-social-cards-once.yml
          git config user.name 'ZeroTrace Bot'; git config user.email 'actions@users.noreply.github.com'
          git add rabbit-hole/assets .github/workflows/optimize-rabbit-social-cards-once.yml
          git commit -m 'Optimize seven Rabbit Hole social cards' && git push origin HEAD:main
